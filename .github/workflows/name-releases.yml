name: Name music releases

on:
  push:
    branches: [main]
    paths: [".github/workflows/name-releases.yml"]
  workflow_run:
    workflows: ["Build Windows Relay"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-release-names
  cancel-in-progress: false

jobs:
  name-releases:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Apply RunsFormingMusic version titles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' |
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^relay-([0-9]+)$ ]]; then
              build="${BASH_REMATCH[1]}"
              if (( build >= 3 )); then
                gh release edit "$tag" --title "RunsFormingMusic v1.$build"
              fi
            fi
          done
