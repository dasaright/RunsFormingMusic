name: Build Windows Relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "relay_agent/**"
      - ".github/workflows/build-relay.yml"

permissions:
  contents: write

concurrency:
  group: windows-relay-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: relay_agent/requirements.txt

      - name: Install relay build dependencies
        run: python -m pip install -r relay_agent/requirements.txt

      - name: Set relay build version
        env:
          RELAY_BUILD: ${{ github.run_number }}
        run: >-
          python -c "import os; from pathlib import Path;
          p=Path('relay_agent/main.py');
          p.write_text(p.read_text(encoding='utf-8').replace('RELAY_BUILD = 0','RELAY_BUILD = '+os.environ['RELAY_BUILD'],1),encoding='utf-8')"

      - name: Verify public relay TLS on Windows
        run: >-
          python -c "import socket; from relay_agent.main import relay_ssl_context;
          host='runsformingbot-production.up.railway.app';
          sock=socket.create_connection((host,443),timeout=20);
          tls=relay_ssl_context().wrap_socket(sock,server_hostname=host);
          print('TLS verified; certificate expires',tls.getpeercert()['notAfter']);
          tls.close()"

      - name: Smoke test desktop panels
        timeout-minutes: 1
        run: >-
          python -c "import tkinter as tk; from unittest.mock import patch;
          from relay_agent.main import RelayWindow, create_root;
          root=create_root();
          mock=patch('threading.Thread.start'); mock.start();
          print('Constructing desktop panels',flush=True);
          window=RelayWindow(root,{}); print('Panels constructed',flush=True); root.update();
          assert window.queue_view.winfo_exists();
          assert window.listbox.winfo_exists();
          assert window.toggle_button.winfo_exists();
          root.destroy(); mock.stop(); print('Desktop panels initialized')"

      - name: Test relay and Windows installer
        run: python -m unittest discover -s tests -v

      - name: Build relay executable
        run: >-
          pyinstaller --clean --noconfirm --onefile --windowed --paths .
          --collect-all piper --collect-all onnxruntime --collect-all sounddevice --collect-all _sounddevice_data --collect-data certifi --collect-all tkinterdnd2 --name TacoBot relay_agent/main.py

      - name: Download current yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/Files" | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "dist/Files/yt-dlp.exe"

      - name: Download FFmpeg essentials
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"
          Expand-Archive "ffmpeg.zip" -DestinationPath "ffmpeg-build"
          $ffmpeg = Get-ChildItem "ffmpeg-build" -Recurse -Filter "ffmpeg.exe" |
            Select-Object -First 1
          Copy-Item $ffmpeg.FullName "dist/Files/ffmpeg.exe"

      - name: Verify editing an actively playing file releases its lock
        shell: pwsh
        run: |
          $env:TEST_FFMPEG_PATH = (Resolve-Path "dist/Files/ffmpeg.exe").Path
          python -m unittest discover -s tests -p test_clip_files.py -v

      - name: Verify real Piper synthesis
        run: >-
          python -c "import wave; from relay_agent.tts import PiperSpeech;
          speech=PiperSpeech('tts-build-test');
          output=speech.synthesize('TacoBot speech test.');
          audio=wave.open(str(output)); assert audio.getnframes()>0; audio.close();
          print('Piper model download and real speech synthesis verified')"

      - name: Verify packaged executable and dependencies
        shell: pwsh
        run: |
          $env:TACOBOT_TTS_TEST_DIR = (Resolve-Path "tts-build-test").Path
          $process = Start-Process -FilePath (Resolve-Path "dist/TacoBot.exe") -ArgumentList "--self-test" -PassThru
          if (-not $process.WaitForExit(60000)) {
            taskkill /PID $process.Id /T /F
            Get-Content "build/TacoBot/warn-TacoBot.txt"
            throw "Packaged relay self-test timed out"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            if (Test-Path "dist/Files/self-test-error.txt") { Get-Content "dist/Files/self-test-error.txt" }
            throw "Packaged relay self-test failed"
          }

      - name: Test real frozen installer and restart
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "Relay Update Test"
          $stage = Join-Path $env:RUNNER_TEMP "Relay Update Stage"
          New-Item -ItemType Directory -Force "$fixture/Files", "$fixture/sharedclips", "$stage/payload/Files" | Out-Null
          Copy-Item "dist/TacoBot.exe" "$fixture/Relay Custom Name.exe"
          Copy-Item "dist/TacoBot.exe" "$stage/payload/TacoBot.exe"
          Copy-Item "dist/Files/*" "$fixture/Files"
          Copy-Item "dist/Files/*" "$stage/payload/Files"
          Set-Content "$fixture/README.md" "old README"
          Set-Content "$stage/payload/README.md" "updated README"
          Set-Content "$fixture/relay-config.json" "preserve config"
          Set-Content "$fixture/sharedclips/clip.ogg" "preserve clip"
          $process = Start-Process -FilePath "$fixture/Relay Custom Name.exe" -ArgumentList @('--update-launch-test', ('"' + $stage + '"')) -PassThru
          if (-not $process.WaitForExit(60000)) { taskkill /PID $process.Id /T /F; throw "Update launcher did not exit" }
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path "$fixture/Files/update-restart-ok.txt") -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path "$fixture/Files/update-restart-ok.txt")) {
            Get-Content "$fixture/Files/update*.log" -ErrorAction SilentlyContinue
            Get-Content "$fixture/Files/update-status.txt" -ErrorAction SilentlyContinue
            throw "Frozen executable did not install and restart"
          }
          Get-Content "$fixture/Files/update*.log" -ErrorAction SilentlyContinue
          Get-Content "$fixture/Files/update-status.txt" -ErrorAction SilentlyContinue
          if ((Get-Content "$fixture/README.md").Trim() -ne "updated README") { throw "Update did not copy payload" }
          if ((Get-Content "$fixture/relay-config.json").Trim() -ne "preserve config") { throw "Config was altered" }
          if ((Get-Content "$fixture/sharedclips/clip.ogg").Trim() -ne "preserve clip") { throw "Clips were altered" }
          if (Test-Path "$fixture/TacoBot.exe") { throw "Renamed executable was not updated in place" }
          Write-Host "Actual frozen launcher, install, renamed executable, and restart verified"

      - name: Package relay bundle
        shell: pwsh
        run: |
          Copy-Item "relay_agent/README.md" "dist/README.md"
          Compress-Archive "dist/*" "TacoBot-Windows.zip"
          $manifest = @{
            schema = 1
            build = [int]${{ github.run_number }}
            sha256 = (Get-FileHash "TacoBot-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 "relay-update.json"

      - uses: actions/upload-artifact@v4
        with:
          name: TacoBot-Windows
          path: TacoBot-Windows.zip
          retention-days: 30

      - name: Publish relay release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "relay-${{ github.run_number }}"
          gh release create $tag "TacoBot-Windows.zip" "relay-update.json" --target $env:GITHUB_SHA --title "TacoBot v1.${{ github.run_number }}" --notes "Portable Windows relay with automatic updates. Keep relay-config.json when upgrading." --draft
          if ($LASTEXITCODE -ne 0) { throw "Could not create relay release" }
          gh release edit $tag --draft=false --latest=true
          if ($LASTEXITCODE -ne 0) { throw "Could not publish relay release" }

      - name: Verify public automatic-update download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=30" | Set-Content -Encoding utf8 releases.json
          python -c "import json,shutil; from relay_agent.main import RELAY_BUILD;
          from relay_agent import updater;
          releases=json.load(open('releases.json',encoding='utf-8-sig'));
          original=updater.read_json;
          updater.read_json=lambda url: releases if url==updater.RELEASES_URL else original(url);
          update=updater.find_update(RELAY_BUILD-1); assert update['build']==RELAY_BUILD;
          stage=updater.prepare_update(update); shutil.rmtree(stage);
          print('Public update download, checksum, and file layout verified')"
